# The Rust port of the Home Connect Profile Downloader.
#
# Four pieces, and the split is deliberate:
#
#   crates/hcpd-core    everything with no I/O in it: regions, PKCE, the XML,
#                       the file names, the shape of a profile. Testable without
#                       a network or an account, which is where the tests are.
#   crates/hcpd-client  the Home Connect API, over reqwest.
#   login-helper        a webview, alive only until the OAuth code arrives.
#   app                 the window, in iced.
[workspace]
resolver = "3"
members = ["app", "crates/hcpd-core", "crates/hcpd-client", "login-helper"]

[workspace.package]
version = "2.0.0-beta.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/bruestel/homeconnect-profile-downloader"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order so the JSON we write keeps the key order the Electron version
# wrote. The files are read by people and diffed against older downloads.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# rustls with the platform verifier: certificates are checked by the operating
# system, against its own store. That store holds the roots antivirus programs
# and company proxies install to inspect HTTPS; with a built-in set alone, such
# a machine signs in (the webview uses the system store) and then fails the
# token request with "error sending request" (issue #25).
#
# "no-provider" because reqwest's own choice is aws-lc-rs, a C build that would
# be new to every release runner. ring, which 0.12 used and the runners already
# build, is installed instead; see hcpd-client's `Client::connect`.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "blocking", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
# A tool that runs for a minute and writes some files; size is worth more than
# the last few percent of speed.
opt-level = "s"
lto = true
strip = true
